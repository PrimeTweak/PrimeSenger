name: Build PrimeSenger
run-name: ${{ inputs.build }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      build:
        description: "What to build"
        type: choice
        options:
          - Debug
          - Release
        default: Debug
      ipa_url:
        description: "URL to a decrypted Messenger IPA"
        required: true
        type: string
      liquid_glass:
        description: "Opt the app into Liquid Glass (system controls only)"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      # The installer ends by fetching SDKs from api.github.com unauthenticated;
      # after the Homebrew step that trips the rate limit and the script exits
      # non-zero. The Theos clone itself has already succeeded by then, and the
      # next step installs the SDK over an authenticated download, so this
      # tolerates that specific failure and verifies the clone instead.
      - name: Install Theos
        run: |
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos -o /tmp/install-theos
          bash /tmp/install-theos || echo "installer exited non-zero (SDK fetch); verifying clone"
          if [ ! -f "$HOME/theos/makefiles/common.mk" ]; then
            echo "::error::Theos clone incomplete"; exit 1
          fi
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "Theos clone OK"

      - name: Ensure iOS 16.5 SDK
        run: |
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "SDK already present"
          else
            curl -fsSL -H "Authorization: token ${{ github.token }}" \
              -o /tmp/sdks.tar.gz \
              https://codeload.github.com/theos/sdks/tar.gz/refs/heads/master
            mkdir -p /tmp/sdks
            tar -xzf /tmp/sdks.tar.gz -C /tmp/sdks --strip-components=1
            mkdir -p "$THEOS/sdks"
            mv /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          fi
          ls -1 "$THEOS/sdks"

      # Read from control so the artefact names cannot drift from the tweak.
      - name: Read version
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "building PrimeSenger $VERSION"

      # A release is built from the default branch only, never twice for the
      # same version, and only once CHANGELOG.md has a section for it.
      - name: Check release
        if: ${{ inputs.build == 'Release' }}
        run: |
          branch="${{ github.event.repository.default_branch }}"
          if [ "${{ github.ref_name }}" != "$branch" ]; then
            echo "::error::Releases are built from $branch only."
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/releases/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::Version $VERSION is already released. Change Version in control."
            exit 1
          fi
          awk -v v="$VERSION" '$0 == "## " v {found = 1; next} found && /^## / {exit} found {print}' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi

      - name: Build dylib
        run: |
          make clean || true
          make FINALPACKAGE=1 PRIMESENGER_DEBUG=${{ inputs.build == 'Release' && '0' || '1' }}
          mkdir -p out
          DYLIB=$(find .theos -name 'PrimeSenger.dylib' | head -1)
          if [ -z "$DYLIB" ]; then echo "::error::dylib not produced"; exit 1; fi
          cp "$DYLIB" out/PrimeSenger.dylib
          lipo -info out/PrimeSenger.dylib
          otool -L out/PrimeSenger.dylib || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: PrimeSenger-${{ env.VERSION }}-dylib
          path: out/PrimeSenger.dylib

      - name: Install cyan
        run: |
          python3 -m venv /tmp/cyanenv
          /tmp/cyanenv/bin/python -m pip install --upgrade pip
          /tmp/cyanenv/bin/python -m pip install \
            https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download IPA
        run: curl -fsSL "${{ inputs.ipa_url }}" -o messenger.ipa

      - name: Read Messenger version
        run: |
          PLIST=$(unzip -Z1 messenger.ipa | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -1)
          unzip -p messenger.ipa "$PLIST" > app-info.plist
          APPVER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app-info.plist)
          echo "APPVER=$APPVER" >> "$GITHUB_ENV"
          echo "Messenger $APPVER"

      # The input IPA keeps Meta's entitlements in its own signature, so
      # nothing is re-signed; only the two dylibs are added.
      - name: Inject
        run: |
          /tmp/cyanenv/bin/cyan -i messenger.ipa -o out/PrimeSenger.ipa \
                                -f Resources/SideloadKeychainFix.dylib out/PrimeSenger.dylib \
                                -x Resources/Messenger.entitlements \
                                -u -w -e

      # Done here rather than through cyan's plist flag, whose merge or
      # replace behaviour is not documented clearly enough to risk the whole
      # Info.plist on. The script edits one key and leaves the rest alone.
      - name: Opt into Liquid Glass
        if: ${{ inputs.liquid_glass }}
        run: |
          rm -rf glass && mkdir glass
          (cd glass && unzip -qq ../out/PrimeSenger.ipa)
          APP=$(find glass/Payload -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::no app bundle found"; exit 1; fi
          python3 Resources/set-liquid-glass.py "$APP/Info.plist"
          rm -f out/PrimeSenger.ipa
          (cd glass && zip -qry ../out/PrimeSenger.ipa Payload)
          echo "repacked $(ls -la out/PrimeSenger.ipa | awk '{print $5}') bytes"

      - name: Name the IPA
        run: |
          SUFFIX=""
          if [ "${{ inputs.liquid_glass }}" = "true" ]; then SUFFIX="-glass"; fi
          FINAL="PrimeSenger-${VERSION}-Messenger${APPVER}-sideloaded${SUFFIX}.ipa"
          mv out/PrimeSenger.ipa "out/$FINAL"
          echo "FINAL=$FINAL" >> "$GITHUB_ENV"
          echo "packaged $FINAL"

      - name: Check IPA
        run: |
          for lib in PrimeSenger.dylib SideloadKeychainFix.dylib; do
            if ! unzip -Z1 "out/$FINAL" | grep -q "/$lib\$"; then
              echo "::error::$lib is missing from the IPA."
              exit 1
            fi
          done

      - name: Publish debug draft
        if: ${{ inputs.build == 'Debug' }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/releases" --paginate \
                        --jq '.[] | select(.draft and .tag_name == "debug") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          gh release create debug "out/$FINAL" --draft --target "${{ github.sha }}" \
            --title "PrimeSenger $VERSION · debug" --notes ""

      - name: Publish release draft
        if: ${{ inputs.build == 'Release' }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/releases" --paginate \
                        --jq ".[] | select(.draft and .tag_name == \"v$VERSION\") | .id"); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          {
            echo "For Messenger $APPVER · iOS 15.1 or later"
            echo
            echo "## What's new"
            echo
            cat notes.md
          } > body.md
          gh release create "v$VERSION" "out/$FINAL" --draft --target "${{ github.sha }}" \
            --title "PrimeSenger $VERSION" --notes-file body.md
